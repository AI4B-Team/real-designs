<html><head><link rel="stylesheet" href="/src/styles/rd-app.css"><link rel="stylesheet" href="/src/styles/rd-reveal.css">
<style>body{font-family:Inter,system-ui;padding:20px;background:#fff}</style></head>
<body><div class="rd-app"><div id="m"></div></div>
<script type="module">
const C={a:"3417 Hoover Dr",b:"Holiday, FL 34691",agent:"Taylor Adams",phone:"(555) 555, 0134"};
const L=[["none","None","No Intro Card","plain"],["clean","Clean Title Card","Address On White","clean"],["editorial","Editorial","Serif Title, Thin Rule","editorial"],["bold","Bold Listing","Red Block, Large Type","bold"],["minimal_bar","Minimal Bar","Lower Third Only","bar"],["split","Split Frame","Photo Beside The Title","split"],["stamp","Stamp","Boxed Address Stamp","stamp"],["dark","Dark Card","White Type On Black","dark"],["kicker","Kicker","Just Listed Kicker Above Address","kicker"],["agent_white","Agent Card, White","Headshot, Name, Phone","agentw"],["agent_black","Agent Card, Black","Headshot, Name, Phone","agentb"]];
const body=k=>({plain:`<span class="tp-none">No Card</span>`,clean:`<span class="tp-a">${C.a}</span><span class="tp-b">${C.b}</span>`,editorial:`<span class="tp-a serif">${C.a}</span><span class="tp-rule"></span><span class="tp-b">${C.b}</span>`,bold:`<span class="tp-a big">${C.a}</span><span class="tp-b">${C.b}</span>`,bar:`<span class="tp-lower"><span class="tp-a">${C.a}</span><span class="tp-b">${C.b}</span></span>`,split:`<span class="tp-half"></span><span class="tp-side"><span class="tp-a">${C.a}</span><span class="tp-b">${C.b}</span></span>`,stamp:`<span class="tp-stamp"><span class="tp-a">${C.a}</span></span><span class="tp-b">${C.b}</span>`,dark:`<span class="tp-a">${C.a}</span><span class="tp-b">${C.b}</span>`,kicker:`<span class="tp-kick">Just Listed</span><span class="tp-a">${C.a}</span><span class="tp-b">${C.b}</span>`,agentw:`<span class="tp-face"></span><span class="tp-a">${C.agent}</span><span class="tp-b">${C.phone}</span><span class="tp-cta">Book A Showing</span>`,agentb:`<span class="tp-face"></span><span class="tp-a">${C.agent}</span><span class="tp-b">${C.phone}</span><span class="tp-cta">Book A Showing</span>`}[k]);
document.getElementById('m').innerHTML=`<div class="rv-tpls">${L.map(([id,n,note,k])=>`<button class="rv-tpl ${id==='clean'?'on':''}"><span class="rv-tpl-th t-${k}">${body(k)}</span><b>${n}</b><em>${note}</em></button>`).join("")}</div>`;
</script></body></html>
