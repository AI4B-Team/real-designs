name: CI

# npm is the single source of truth for CI. `package-lock.json` is the
# committed lockfile CI installs from; do not let Bun regenerate dependencies
# for CI runs.

on:
  push:
  pull_request:

jobs:
  verify:
    name: Test / Typecheck / Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (frozen lockfile)
        run: npm ci

      # Blocking.
      - name: Unit Tests
        run: |
          set -o pipefail
          npm test -- --reporter=default 2>&1 | tee test.log
        continue-on-error: false

      - name: Test Summary
        if: always()
        run: |
          {
            echo "### Unit Tests"
            echo ""
            grep -E "^ *(Test Files|Tests|Duration)" test.log || echo "No test totals found."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE "^ *Tests .*failed" test.log; then
            {
              echo "<details><summary>Failures</summary>"
              echo ""
              echo '```'
              grep -E "(FAIL|AssertionError|✕)" test.log | head -50
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Blocking.
      - name: Typecheck
        run: npm run typecheck

      # Formatting is separate from meaningful lint violations. Blocking.
      - name: Format Check
        run: npm run format:check

      # Meaningful lint violations, gated against a temporary baseline: touched
      # files may not add new violations. Blocking. Once the baseline reaches
      # zero, replace this with `npm run lint`.
      - name: Lint (Baseline Gate)
        run: |
          set -o pipefail
          npm run lint:ci 2>&1 | tee lint.log
          {
            echo "### Lint"
            echo ""
            echo '```'
            cat lint.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Blocking.
      - name: Production Build
        run: npm run build
