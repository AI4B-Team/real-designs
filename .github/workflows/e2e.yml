name: E2E

# Separate job from CI on purpose. The Playwright suite is still being
# stabilized, so it runs on main and on demand and is NOT yet a required
# check. Flip `continue-on-error` to false (and mark it required in branch
# protection) once the suite is green.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_provider:
        description: "Run the staging smoke test against the real AI provider"
        type: boolean
        default: false

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_REAL_PROVIDER: ${{ inputs.real_provider && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/.report
          retention-days: 7
